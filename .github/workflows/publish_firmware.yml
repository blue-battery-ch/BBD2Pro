name: Publish Firmware to Repo

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies (marked)
      run: npm install marked

    - name: Get latest release info
      id: release
      uses: octokit/request-action@v2.x
      with:
        route: GET /repos/${{ github.repository }}/releases/latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract release info
      id: extract
      run: |
        echo "${{ steps.release.outputs.data }}" > release.json
        TAG=$(jq -r .tag_name release.json)
        NAME=$(jq -r .name release.json)
        BODY=$(jq -r .body release.json)
        echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
        echo "RELEASE_NAME=${NAME}" >> $GITHUB_ENV
        echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
        echo "${BODY}" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Download firmware asset
      run: |
        URL=$(jq -r '.assets[] | select(.name | endswith(".bin")) | .url' release.json)
        FILENAME=$(jq -r '.assets[] | select(.name | endswith(".bin")) | .name' release.json)

        mkdir -p firmware

        curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
             -H "Accept: application/octet-stream" \
             "$URL" -o firmware.tmp.bin

        PRODUCT=$(basename "${GITHUB_REPOSITORY}")
        VERSION=${RELEASE_TAG#v}

        if [ "$FILENAME" = "firmware.bin" ]; then
          FINAL_NAME="${PRODUCT}_${VERSION}.bin"
        else
          FINAL_NAME="$FILENAME"
        fi

        mv firmware.tmp.bin "firmware/$FINAL_NAME"

        echo "FIRMWARE_NAME=$FINAL_NAME" >> $GITHUB_ENV

    - name: Generate version.json and HTML
      run: |
        echo "{\"version\":\"${RELEASE_TAG#v}\",\"filename\":\"$FIRMWARE_NAME\"}" > firmware/version.json
        echo "${RELEASE_BODY}" > firmware/release.md
        node -e "import('marked').then(m => require('fs').writeFileSync('firmware/release.html', m.marked(process.env.RELEASE_BODY)))"

    - name: Commit and Push
      run: |
        BRANCH="main"
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          BRANCH="test"
        fi

        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"

        git fetch origin $BRANCH || git checkout --orphan $BRANCH

        git switch $BRANCH || git checkout -b $BRANCH
        mkdir -p firmware

        git add firmware/
        git commit -m "Add firmware $FIRMWARE_NAME from release $RELEASE_TAG" || echo "Nothing to commit"
        git push origin $BRANCH
